#Defining the client (Simulates Mist Access Point0
client hpe_supplicant {
	#The static IP of my ubuntu client container from the docker-compose network
	ipaddr = 0.0.0.0/0

	#The pre-shared key used to encrypt the RADIUS payloads
	secret = hpe_radius_secret_2026

	#Require message authenticator for EAP protocols (standard for 802.1X)
	require_message_authenticator = yes

	#Standard NAS type
	nastype = other
}

